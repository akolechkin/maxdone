<div id="check-{{ item.id }}" class="flex items-center gap-2 text-xs py-0.5 group">
  <button hx-post="{% url 'toggle_check_item' item.id %}" hx-target="#check-{{ item.id }}" hx-swap="outerHTML"
          class="w-4 h-4 rounded border shrink-0 {% if item.done %}bg-teal border-teal{% else %}border-line-strong{% endif %}"></button>
  <span class="flex-1 {% if item.done %}line-through text-ink-faint{% endif %}">{{ item.title }}</span>
  <button hx-post="{% url 'check_item_delete' item.id %}" hx-target="#checklist-{{ item.task.id }}" hx-swap="outerHTML"
          class="opacity-100 md:opacity-0 md:group-hover:opacity-100 text-ink-faint hover:text-ink">&times;</button>
</div>
