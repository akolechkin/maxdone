{% extends "base.html" %}
{% block content %}
<div class="p-3 max-w-[800px] mx-auto" x-data="{ editorOpen:false }">
  <div class="bg-surface border border-line rounded-lg overflow-hidden min-h-[400px]">
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-line px-4 py-3">
      <div class="flex items-center gap-3">
        <a href="{% url 'board' %}" class="text-sm text-ink-muted hover:text-ink">← задачи</a>
        <h3 class="text-lg font-medium m-0">Цели</h3>
      </div>
      <div class="flex items-center gap-2">
        <a href="?scope=mine" hx-get="?scope=mine" hx-target="#goal-list"
           class="text-xs px-2 py-1 rounded-md {% if scope != 'shared' %}bg-accent-soft text-accent-fg{% else %}text-ink-muted{% endif %}">Мои</a>
        <a href="?scope=shared" hx-get="?scope=shared" hx-target="#goal-list"
           class="text-xs px-2 py-1 rounded-md {% if scope == 'shared' %}bg-accent-soft text-accent-fg{% else %}text-ink-muted{% endif %}">Общие</a>
        <button class="btn-accent" hx-get="{% url 'goal_new' %}" hx-target="#goal-editor" @click="editorOpen=true">+ Цель</button>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_auto]">
      <div id="goal-list" class="p-4">{% include "tasks/_goal_list.html" %}</div>
      {# editor: fixed-width side column on md+, full-screen overlay below md #}
      <div class="hidden md:block fixed inset-0 z-40 bg-surface overflow-y-auto
                  md:static md:inset-auto md:z-auto md:bg-transparent md:overflow-hidden
                  md:border-l md:border-line md:transition-all md:w-0"
           :class="editorOpen ? '!block md:!w-[300px]' : ''">
        <div class="w-full md:w-[300px] p-4" id="goal-editor"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
