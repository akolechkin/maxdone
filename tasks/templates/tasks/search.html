{% extends "base.html" %}
{% block content %}
<div class="p-3 max-w-[720px] mx-auto">
  <div class="bg-surface border border-line rounded-lg overflow-hidden min-h-[300px]">
    <div class="flex items-center gap-3 border-b border-line px-4 py-3">
      <a href="{% url 'board' %}" class="text-sm text-ink-muted hover:text-ink">← задачи</a>
      <input name="q" value="{{ q }}" placeholder="Поиск задач и целей…" autofocus
             hx-get="{% url 'search' %}" hx-target="#search-results" hx-trigger="keyup changed delay:300ms"
             class="flex-1 border border-line rounded-md px-3 py-2 text-sm">
    </div>
    <div id="search-results" class="p-4">{% include "tasks/_search_results.html" %}</div>
  </div>
</div>
{% endblock %}
