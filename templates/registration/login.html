{% extends "base.html" %}
{% block content %}
<div class="min-h-screen grid place-items-center">
  <form method="post" class="bg-surface border border-line rounded-lg p-6 w-[320px]">
    {% csrf_token %}
    <div class="flex items-center gap-2 mb-5">
      <div class="w-8 h-8 rounded-md bg-accent text-white grid place-items-center font-medium">M</div>
      <span class="text-lg font-medium">maxdone</span>
    </div>
    <div class="space-y-3">
      <input name="username" placeholder="Имя пользователя"
             class="w-full border border-line rounded-md px-3 py-2 text-sm">
      <input name="password" type="password" placeholder="Пароль"
             class="w-full border border-line rounded-md px-3 py-2 text-sm">
      <button class="btn-accent w-full">Войти</button>
    </div>
  </form>
</div>
{% endblock %}
